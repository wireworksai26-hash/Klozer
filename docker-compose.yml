services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: klozer_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-klozer_secure_root_password_2026}
      MYSQL_DATABASE: ${DB_NAME:-klozer_db}
      MYSQL_USER: ${DB_USER:-klozer_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-klozer_secure_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - klozer_network

  # Backend Service (Node.js Express + Socket.io)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: klozer_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-klozer_user}
      DB_PASSWORD: ${DB_PASSWORD:-klozer_secure_pass_2026}
      DB_NAME: ${DB_NAME:-klozer_db}
      JWT_SECRET: ${JWT_SECRET:-klozer_ultra_secure_jwt_secret_key_2026_prod}
    ports:
      - "5000:5000"
    networks:
      - klozer_network

  # Frontend Service (Next.js 16)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: klozer_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    ports:
      - "3000:3000"
    networks:
      - klozer_network

  # Reverse Proxy (Nginx)
  nginx:
    image: nginx:alpine
    container_name: klozer_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - klozer_network

volumes:
  mysql_data:

networks:
  klozer_network:
    driver: bridge
